<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
<div class="Card"> 
    <h1 class="greeting">Good afternoon</h1> 

    <form>
        <h1 class="signin">Username:</h1> 
        <input 
            type="text" 
            name="username" 
            id="Username" 
            required 
            placeholder="Enter username here !"
        > 

        <h1 class="Password">Password:</h1> 
        <input 
            type="password" 
            name="password" 
            id="Passwordbox" 
            required 
            placeholder="Enter password here !"
        > 

        <input 
            type="submit" 
            value="Login" 
            id="Login"
        > 
    </form>
    

    <a href="signup.html"  id="signtext">Don't have an account? Click here!</a>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js"></script>
</body>
</html>
