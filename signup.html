<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
<div class="Card"> 
    <h1 class="greeting">Good afternoon</h1> 

    <form>
        <h1 class="signin">Username:</h1> 
        <input 
            type="text" 
            name="username" 
            id="Username" 
            required 
            placeholder="Enter username here !"
        > 

        <h1 class="Password" >Password:</h1> 
        <input 
            type="password" 
            name="password" 
            id="Passwordbox" 
            required 
            placeholder="Enter password here !"
        > 
        <label id="Emailtext" >Email:</label>
        <input type="email" name="youremailhere@Gmail.com" id="Emailbox"
        placeholder="youremailhere@Gmail.com"

        >
        <input 
            type="submit" 
            value="sign up !" 
            id="signup"
        > 
    </form>
    

    <a href="index.html"  id="signtext"> have an account? Click here!</a>
<div id="Div2">
    <label for="googleButton" id="Googletext">
        Don't want to take 2 seconds click here !
    </label>

    <button type="button" onclick="discordLogin()" id="googleButton">
        <img src="loginDiscord.png" alt="Continue with Discord">
    </button>
</div>

    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="signup.js"></script>
</body>
</html>
